{% extends "base.html" %}
{% block title %}PM ADAS · 주행 리포트{% endblock %}
{% block content %}
<section class="screen-pad">
  <div>
    <div class="greet-dim">8월 25일 · 18:12–18:34</div>
    <h1 class="greet-h" style="font-size:19px;">라이딩 리포트</h1>
  </div>

  <div class="map" style="height:150px;">
    <svg viewBox="0 0 260 150">
      <path d="M14,120 C50,124 66,92 96,86 C130,78 140,54 176,44 C200,36 196,20 240,14"
        fill="none" stroke="var(--safe)" stroke-width="4" stroke-linecap="round"/>
      <path d="M96,86 C130,78 140,54 176,44" fill="none" stroke="var(--caution)" stroke-width="4" stroke-linecap="round"/>
      <path d="M176,44 C200,36 196,20 240,14" fill="none" stroke="var(--danger)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="176" cy="44" r="4" fill="var(--surface)" stroke="var(--danger)" stroke-width="2"/>
    </svg>
  </div>
  <div class="legend">
    <span class="li"><span class="sw" style="background:var(--safe)"></span>안전</span>
    <span class="li"><span class="sw" style="background:var(--caution)"></span>주의</span>
    <span class="li"><span class="sw" style="background:var(--danger)"></span>위험</span>
  </div>

  <div class="card ring-wrap">
    <svg width="58" height="58" viewBox="0 0 58 58">
      <circle cx="29" cy="29" r="24" fill="none" stroke="var(--line)" stroke-width="6"/>
      <circle cx="29" cy="29" r="24" fill="none" stroke="var(--safe)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="150.8" stroke-dashoffset="24" transform="rotate(-90 29 29)"/>
    </svg>
    <div>
      <div class="ring-score">84<span style="font-size:14px;color:var(--text-dim);font-weight:500;">점</span></div>
      <div class="ring-label">종합 안전점수 · 상위 30%</div>
    </div>
  </div>

  <div class="grid2x2">
    <div class="cell"><div class="v mono">5.2km</div><div class="l">총 거리</div></div>
    <div class="cell"><div class="v mono">22:04</div><div class="l">이동 시간</div></div>
    <div class="cell"><div class="v mono">14.2km/h</div><div class="l">평균 속도</div></div>
    <div class="cell"><div class="v mono" style="color:var(--danger)">1회</div><div class="l">급정거</div></div>
  </div>

  <div class="section-label">위험 이벤트</div>
  <div class="card" style="padding:2px 16px 4px;">
    <div class="sev-row">
      <div class="sev-bar" style="background:var(--danger)"></div>
      <div class="sev-body"><div class="time mono">18:19:42</div><div class="desc">보행자 접근 · TTC 1.2초 · 2.8m</div></div>
    </div>
    <div class="sev-row">
      <div class="sev-bar" style="background:var(--caution)"></div>
      <div class="sev-body"><div class="time mono">18:26:05</div><div class="desc">자전거 근접 · 진행경로 밖 · 4.1m</div></div>
    </div>
  </div>
</section>
{% endblock %}
