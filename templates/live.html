<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PM ADAS · 실시간 주행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="app-body">
<section class="screen-pad">
  <div class="row-between">
    <span class="chip safe"><span class="d safe"></span>라이딩 중</span>
    <span class="chip neutral" id="gps-status">GPS 확인 중</span>
  </div>

  <div>
    <div class="timer mono" id="timer">00:00</div>
    <div class="timer-l">경과 시간</div>
  </div>

  <div class="map">
    <svg viewBox="0 0 260 168">
      <path d="M18,140 C60,150 70,110 100,100 C140,88 150,60 190,48 C210,42 205,25 232,22"
        fill="none" stroke="var(--safe)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="18" cy="140" r="4" fill="var(--text-dim)"/>
    </svg>
  </div>

  <div class="risk-banner safe" id="risk-banner">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01"/></svg>
    <div>
      <div class="t1">현재 상태 · 안전</div>
      <div class="t2">실시간 데이터 연결 대기 중</div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-col"><div class="stat-v mono" id="stat-speed">0.0</div><div class="stat-l">현재 속도 km/h</div></div>
    <div class="stat-col"><div class="stat-v mono" id="stat-distance">0.0</div><div class="stat-l">이동 거리 km</div></div>
    <div class="stat-col"><div class="stat-v mono" id="stat-events">0</div><div class="stat-l">위험 감지 회</div></div>
  </div>

  <div class="btn-row">
    <button id="end-ride-btn" type="button" class="btn-outline danger">종료</button>
  </div>
</section>
</main>
<script>
  window.RIDE_TOKEN = {{ ride_token|tojson }};
  window.RIDE_UPLOAD_URL = {{ ride_upload_url|tojson }};
  window.WEB_APP_URL = {{ web_app_url|tojson }};
</script>
<script src="{{ url_for('static', filename='js/live.js') }}"></script>
</body>
</html>
