{% extends "base.html" %}
{% block title %}PM ADAS · 실시간 주행{% endblock %}
{% block content %}
<section class="screen-pad">
  <div class="row-between">
    <span class="chip safe"><span class="d safe"></span>라이딩 중</span>
    <span class="chip neutral">Pi 연결 대기</span>
  </div>

  <div>
    <div class="timer mono" id="timer">00:00</div>
    <div class="timer-l">경과 시간</div>
  </div>

  <div class="map">
    <svg viewBox="0 0 260 168">
      <path d="M18,140 C60,150 70,110 100,100 C140,88 150,60 190,48 C210,42 205,25 232,22"
        fill="none" stroke="var(--safe)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="18" cy="140" r="4" fill="var(--text-dim)"/>
    </svg>
  </div>

  <div class="risk-banner safe" id="risk-banner">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01"/></svg>
    <div>
      <div class="t1">현재 상태 · 안전</div>
      <div class="t2">실시간 데이터 연결 대기 중</div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-col"><div class="stat-v mono" id="stat-speed">0.0</div><div class="stat-l">현재 속도 km/h</div></div>
    <div class="stat-col"><div class="stat-v mono" id="stat-distance">0.0</div><div class="stat-l">이동 거리 km</div></div>
    <div class="stat-col"><div class="stat-v mono" id="stat-events">0</div><div class="stat-l">위험 감지 회</div></div>
  </div>

  <div class="btn-row">
    <a href="{{ url_for('home') }}" class="btn-outline danger">종료</a>
  </div>
</section>
{% endblock %}
